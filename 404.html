<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <script>
    // aiXP moved to its own org site; send old /aiXP/... links to the same page there.
    if (/^\/aiXP(\/|$)/.test(window.location.pathname)) {
      window.location.replace('https://aixp.scottkirvan.com' + window.location.pathname + window.location.search + window.location.hash);
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 4rem 1rem; text-align: center; color: #1d1f22; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #e8e6e1; background: #141517; } a { color: #8ab4f8; } }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p><a href="/">Go to scottkirvan.com</a></p>
</body>
</html>
